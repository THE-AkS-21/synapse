# ============================================
# Application
# ============================================

spring.application.name=synapse
server.port=${PORT:8080}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Default profile for local development
spring.profiles.default=dev

# ============================================
# JWT Configuration
# ============================================

jwt.secret=${JWT_SECRET:your-very-strong-and-long-jwt-secret-key-that-is-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================
# Message Buffer Configuration
# ============================================

message.buffer.enabled=true
message.buffer.max-batch-size=100
message.buffer.flush-interval-ms=5000
message.buffer.max-retries=3
message.buffer.initial-capacity=200
message.buffer.retry-delay-ms=1000

# ============================================
# Rate Limiting
# ============================================

rate.limit.enabled=false
rate.limit.messages.per.second=5
rate.limit.burst.capacity=10

# ============================================
# Presence System
# ============================================

presence.enabled=true
presence.heartbeat.interval.ms=30000
presence.typing.timeout.ms=5000
presence.cleanup.interval.ms=30000

# ============================================
# Redis Stream Message Buffer
# ============================================

message.buffer.stream.enabled=true
message.buffer.stream.key=messages:pending:stream
message.buffer.consumer.group=batch-processor

# ============================================
# WebSocket Performance Configuration
# ============================================

spring.websocket.servlet.max-text-message-size=65536
spring.websocket.servlet.max-binary-message-size=65536

# WebSocket send buffer
spring.websocket.servlet.max-session-idle-timeout=300000


# ============================================
# Async Task Execution
# ============================================

spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=500
spring.task.execution.thread-name-prefix=synapse-async-

# Health Monitoring
#management.endpoint.prometheus.enabled=true

# --- ACTUATOR (HEARTBEAT / HEALTHCHECKS) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# --- LOGGING ---
logging.level.root=INFO
logging.level.com.skaeht.synapse=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO

# Output logs to a file in production
logging.file.name=logs/synapse.log
logging.logback.rollingpolicy.max-history=30

