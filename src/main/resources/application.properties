spring.application.name=synapse

# Server Configuration
server.port=8080

# Spring Datasource (PostgreSQL)
# Reads from .env file or environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:synapse_chat}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Redis
# Reads from .env file or environment variables
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Secret
# Reads from .env file or environment variables
jwt.secret=${JWT_SECRET:your-very-strong-and-long-jwt-secret-key-that-is-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}