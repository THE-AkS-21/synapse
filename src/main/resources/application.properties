spring.application.name=synapse

# Server Configuration
server.port=8080

# Spring Datasource (PostgreSQL)
# These are for local testing. Render will provide these as Env Variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/synapse_chat
spring.datasource.username=postgres
spring.datasource.password=your_db_password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Redis
# These are for local testing. Render will provide this as an Env Variable.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT Secret
# Use a strong, long, base64-encoded string here
jwt.secret=your-very-strong-and-long-jwt-secret-key-that-is-at-least-256-bits

# JWT Expiration (in milliseconds)
# 86400000ms = 24 hours
jwt.expiration=86400000