# render.yaml
services:
  # 1. The Spring Boot Application
  - type: web
    name: chat-app
    env: java
    plan: free
    build:
      command: ./mvnw -Dmaven.test.skip=true clean install
    start:
      command: java -jar target/synapse-0.0.1-SNAPSHOT.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        fromService:
          type: psql
          name: chat-db
          property: connectionString
      - key: SPRING_REDIS_URL
        fromService:
          type: redis
          name: chat-redis
          property: connectionString

  # 2. The PostgreSQL Database
  - type: psql
    name: chat-db
    plan: free
    databaseName: chat
    user: chat_user

  # 3. The Redis Instance
  - type: redis
    name: chat-redis
    plan: free