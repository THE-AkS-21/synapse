name: Synapse Tests

on:
  push:
    branches: [ develop, main ]

  pull_request:
    branches: [ develop, main ]

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build project
        run: mvn -B clean package --file pom.xml

      - name: Run tests
        run: mvn test