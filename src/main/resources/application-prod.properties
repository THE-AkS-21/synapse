# ============================================
# PostgreSQL (from environment variables)
# ============================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.sslmode=require

spring.jpa.hibernate.ddl-auto=validate

# ============================================
# HikariCP Pool (high concurrency)
# ============================================

spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# ============================================
# Redis (Render Redis / Upstash / External)
# ============================================

spring.data.redis.url=${REDIS_URL}
spring.data.redis.ssl.enabled=true

# ============================================
# Logging (Production safe)
# ============================================

logging.level.com.skaeht.synapse=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# Actuator (Production Monitoring)
# ============================================

management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ============================================
# Redis Connection Pool Optimization
# ============================================

spring.data.redis.timeout=60000
spring.data.redis.client-type=lettuce

spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5
spring.data.redis.lettuce.pool.max-wait=2000

# ============================================
# PostgreSQL Optimization
# ============================================

spring.datasource.hikari.pool-name=SynapseHikariPool

spring.datasource.hikari.auto-commit=false

spring.datasource.hikari.leak-detection-threshold=20000

spring.datasource.hikari.validation-timeout=5000

# ============================================
# HTTP Compression
# ============================================

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

