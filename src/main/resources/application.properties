# Application name
spring.application.name=synapse

# Server Configuration
server.port=8080

# Spring Datasource (PostgreSQL)
# Reads from .env file or environment variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:synapse_chat}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Redis
# Reads from .env file or environment variables
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT Secret
# Reads from .env file or environment variables
jwt.secret=${JWT_SECRET:your-very-strong-and-long-jwt-secret-key-that-is-at-least-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# HikariCP Connection Pool Configuration
# Optimized for high concurrency
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Redis Lettuce Pool Configuration
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=10
spring.data.redis.lettuce.pool.max-wait=2000ms

# Actuator Configuration
# Expose health and metrics endpoints
management.endpoints.web.exposure.include=health,metrics,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.health.redis.enabled=true
management.health.db.enabled=true

# Metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Logging
logging.level.com.skaeht.synapse=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.messaging=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# Phase 2: Message Buffer Configuration
# ============================================
message.buffer.enabled=true
message.buffer.max-batch-size=100
message.buffer.flush-interval-ms=5000
message.buffer.max-retries=3
message.buffer.initial-capacity=200
message.buffer.retry-delay-ms=1000

# ============================================
# Phase 3: Rate Limiting Configuration
# ============================================
rate.limit.enabled=false
rate.limit.messages.per.second=5
rate.limit.burst.capacity=10

# ============================================
# Presence System Configuration
# ============================================
presence.enabled=true
presence.heartbeat.interval.ms=30000
presence.typing.timeout.ms=5000
presence.cleanup.interval.ms=30000

# ============================================
# Redis Stream Message Buffer Configuration
# ============================================
message.buffer.stream.enabled=true
message.buffer.stream.key=messages:pending:stream
message.buffer.consumer.group=batch-processor